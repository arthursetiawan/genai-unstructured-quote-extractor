[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genai-unstructured-quote-extractor"
version = "0.1.0"
description = "Applied GenAI pipeline for extracting and reconciling automotive/freight quote line items"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Arthur Setiawan" }]
dependencies = [
  "pydantic>=2.6",
  "rapidfuzz>=3.6",
  "tenacity>=8.2",
  "python-dotenv>=1.0",
  "streamlit>=1.32",
  "httpx>=0.27",
]

[project.optional-dependencies]
llm = [
  "google-generativeai>=0.8",
  "openai>=1.30",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.scripts]
generate-catalog = "quote_extractor.catalog:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
